<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Article</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page-article">

    <a href="javascript:history.back()" class="bouton-retour">
        ← Retour aux articles
    </a>

    <div id="article-complet"></div>

    <div id="message-erreur"></div>

</main>

<script>

function echapperTexte(texte) {
    const div = document.createElement("div");
    div.textContent = texte || "";
    return div.innerHTML;
}

function convertirYoutube(url) {
    if (!url) return "";

    try {
        const adresse = new URL(url);
        let videoId = "";

        if (adresse.hostname.includes("youtu.be")) {
            videoId = adresse.pathname
                .replace("/", "")
                .split("?")[0];
        }

        if (adresse.hostname.includes("youtube.com")) {
            videoId = adresse.searchParams.get("v");

            if (!videoId && adresse.pathname.includes("/embed/")) {
                videoId = adresse.pathname
                    .split("/embed/")[1]
                    .split("?")[0];
            }

            if (!videoId && adresse.pathname.includes("/shorts/")) {
                videoId = adresse.pathname
                    .split("/shorts/")[1]
                    .split("?")[0];
            }
        }

        if (videoId) {
            return `https://www.youtube.com/embed/${videoId}`;
        }

        return url;

    } catch (erreur) {
        return url;
    }
}

function creerDate(date) {
    if (!date) return "";

    const datePublication = new Date(date);

    if (Number.isNaN(datePublication.getTime())) {
        return "";
    }

    return datePublication.toLocaleDateString("fr-CA", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}


/* =========================
   RÉCUPÉRER ID ARTICLE
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const articleId =
    params.get("id");


if (!articleId) {

    document.getElementById(
        "message-erreur"
    ).innerHTML = `
        <div class="erreur">
            Aucun article sélectionné.
        </div>
    `;

} else {

    chargerArticle();
}


/* =========================
   CHARGER ARTICLE
========================= */

async function chargerArticle() {

    try {

        /* =========================
           ARTICLE PRINCIPAL
        ========================= */

        const articleResponse =
    await fetch(
        `/article/${articleId}`
    );


        if (!articleResponse.ok) {
            throw new Error(
                "Article introuvable."
            );
        }


        const article =
            await articleResponse.json();


        document.title =
            article.titre;


        const container =
            document.getElementById(
                "article-complet"
            );


        container.innerHTML = `

            <article class="article-page-complete">

                <div class="categorie-article">
                    ${echapperTexte(
                        article.categorie
                    )}
                </div>

                <h1 class="titre-article-complet">
                    ${echapperTexte(
                        article.titre
                    )}
                </h1>

                <div class="informations-article-complet">

                    <span>
                        Par ${echapperTexte(
                            article.author ||
                            "Auteur inconnu"
                        )}
                    </span>

                    <span>
                        ${creerDate(
                            article.date_publication
                        )}
                    </span>

                </div>

                <div id="contenu-blocs"></div>

            </article>
        `;


        /* =========================
           BLOCS ARTICLE
        ========================= */

        const blocsResponse =
            await fetch(
                `/article/${articleId}/blocs`
            );


        if (!blocsResponse.ok) {
            throw new Error(
                "Impossible de charger le contenu de l'article."
            );
        }


        const blocs =
            await blocsResponse.json();


        const zone =
            document.getElementById(
                "contenu-blocs"
            );


        blocs.forEach(bloc => {

            /* =========================
               TEXTE
            ========================= */

            if (
                bloc.type_bloc === "texte"
            ) {

                const paragraphe =
                    document.createElement("p");

                paragraphe.className =
                    "paragraphe-article";

                paragraphe.textContent =
                    bloc.contenu;

                zone.appendChild(
                    paragraphe
                );
            }


            /* =========================
               IMAGE
            ========================= */

            if (
                bloc.type_bloc === "image"
            ) {

                const image =
                    document.createElement("img");

                image.className =
                    "image-bloc";

               image.src = bloc.contenu;

                image.alt =
                    article.titre;

                zone.appendChild(
                    image
                );
            }


            /* =========================
               VIDEO
            ========================= */

            if (
                bloc.type_bloc === "video"
            ) {

                const video =
                    document.createElement("video");

                video.className =
                    "video-bloc";

                video.controls = true;

               video.src = bloc.contenu;

                zone.appendChild(
                    video
                );
            }


            /* =========================
               AUDIO
            ========================= */

            if (
                bloc.type_bloc === "audio"
            ) {

                const audio =
                    document.createElement("audio");

                audio.className =
                    "audio-bloc";

                audio.controls = true;
                audio.src = bloc.contenu;

                zone.appendChild(
                    audio
                );
            }


            /* =========================
               LIEN
            ========================= */

            if (
                bloc.type_bloc === "lien"
            ) {

                const lien =
                    bloc.contenu;


                if (
                    lien.includes("youtube.com") ||
                    lien.includes("youtu.be")
                ) {

                    const iframe =
                        document.createElement(
                            "iframe"
                        );

                    iframe.className =
                        "youtube-bloc";

                    iframe.src =
                        convertirYoutube(lien);

                    iframe.allowFullscreen =
                        true;

                    iframe.setAttribute(
                        "allow",
                        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    );

                    zone.appendChild(
                        iframe
                    );

                } else {

                    const a =
                        document.createElement("a");

                    a.className =
                        "lien-bloc";

                    a.href =
                        lien;

                    a.target =
                        "_blank";

                    a.rel =
                        "noopener noreferrer";

                    a.textContent =
                        "Ouvrir le lien";

                    zone.appendChild(
                        a
                    );
                }
            }

        });


        if (blocs.length === 0) {

            zone.innerHTML = `
                <p>
                    Aucun contenu détaillé disponible.
                </p>
            `;
        }


    } catch (erreur) {

        console.error(
            erreur
        );

        document.getElementById(
            "message-erreur"
        ).innerHTML = `
            <div class="erreur">
                Impossible de charger cet article.
            </div>
        `;
    }
}

</script>

</body>
</html>
