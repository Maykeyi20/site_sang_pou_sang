<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer l'administrateur</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:10px;
            width:350px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#c40000;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#980000;
        }

        #message{
            margin-top:20px;
            text-align:center;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="box">

<h2>Créer le premier administrateur</h2>

<input
type="text"
id="username"
placeholder="Nom d'utilisateur"
>

<input
type="password"
id="password"
placeholder="Mot de passe"
>

<button onclick="creerAdmin()">

Créer l'administrateur

</button>

<p id="message"></p>

</div>

<script>

async function creerAdmin(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const reponse = await fetch(
        "http://127.0.0.1:3000/create-admin",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username,
                password
            })

        }
    );

    const resultat = await reponse.json();

    document.getElementById("message").innerHTML =
        resultat.message;

}

</script>

</body>
</html>
